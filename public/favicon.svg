<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="EduPay">
  <!--
    A favicon is read at 16px, so this is not logo.svg scaled down. The mark
    fills more of the tile, the strokes are heavier, and the corner radius is
    tighter — at 16px a generous radius eats the corners and the shape turns to
    mush. The tile stays solid jade so it holds on both light and dark tab bars.
  -->
  <defs>
    <linearGradient id="favTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#23A99C"/>
      <stop offset="52%" stop-color="#0E7F76"/>
      <stop offset="100%" stop-color="#083F3C"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#favTile)"/>

  <!-- Stem -->
  <rect x="7.4" y="6.6" width="4.6" height="18.8" rx="2.1" fill="#ffffff"/>

  <!-- Arms: top and bottom full width, the middle short and amber. -->
  <rect x="10.6" y="6.6" width="14" height="4.6" rx="2.1" fill="#ffffff"/>
  <rect x="10.6" y="13.7" width="8.8" height="4.6" rx="2.1" fill="#FBBF24"/>
  <rect x="10.6" y="20.8" width="14" height="4.6" rx="2.1" fill="#ffffff"/>
</svg>
