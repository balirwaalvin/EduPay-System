<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <title>Reset your password · EduPay</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="auth-page" data-flow="reset">
  <div class="space-backdrop" aria-hidden="true">
    <div class="space-layer space-layer-far"></div>
    <div class="space-layer space-layer-mid"></div>
    <div class="space-glow"></div>
  </div>

  <main class="auth-wrapper">
    <div class="auth-card">
      <header class="auth-logo">
        <h1>Edu<span>Pay</span></h1>
        <p>Choose a new password</p>
      </header>

      <p id="flowError" class="auth-alert auth-alert-error" role="alert" hidden></p>
      <p id="flowNotice" class="auth-alert auth-alert-success" role="status" hidden></p>

      <div class="auth-form" id="flowLoading" role="status">
        <p class="flow-loading"><span class="spinner" aria-hidden="true"></span> Checking your link…</p>
      </div>

      <div class="auth-form" id="flowInvalid" hidden>
        <p class="flow-invalid">This link cannot be used. Ask your administrator to send a new one.</p>
      </div>

      <form id="passwordForm" class="auth-form" novalidate hidden>
        <p class="flow-greeting" id="flowGreeting"></p>

        <div class="form-group">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" required
            minlength="10" aria-describedby="passwordHint strengthMeter">
          <p class="form-hint" id="passwordHint">At least 10 characters, combining three of: lowercase
            letters, uppercase letters, numbers, symbols.</p>
          <p class="strength-meter" id="strengthMeter" role="status" aria-live="polite"></p>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm new password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
        </div>

        <button type="submit" id="flowSubmit" class="btn btn-primary btn-block">Set my password</button>
      </form>
    </div>

    <p class="auth-footnote"><a href="/">Back to sign in</a></p>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/password-flows.js"></script>
</body>

</html>
