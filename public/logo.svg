<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="EduPay">
  <!--
    An E built from a stem and three arms. The stem matters: three bars alone
    read as a hamburger menu rather than a letter. The short middle arm is amber
    because on a payslip the middle line is the one that counts — net pay.
  -->
  <defs>
    <linearGradient id="edupayTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#23A99C"/>
      <stop offset="52%" stop-color="#0E7F76"/>
      <stop offset="100%" stop-color="#083F3C"/>
    </linearGradient>
  </defs>

  <rect width="40" height="40" rx="11.5" fill="url(#edupayTile)"/>

  <!-- Edge light, so the tile reads as a surface rather than a flat block. -->
  <rect x=".7" y=".7" width="38.6" height="38.6" rx="10.8" fill="none"
        stroke="#ffffff" stroke-opacity=".18" stroke-width="1.4"/>

  <!-- Stem -->
  <rect x="11" y="10.4" width="3.9" height="19.2" rx="1.95" fill="#ffffff"/>

  <!-- Arms: top and bottom white, the middle one short and amber. -->
  <rect x="14.2" y="10.4" width="14.8" height="3.9" rx="1.95" fill="#ffffff"/>
  <rect x="14.2" y="18.05" width="9.2" height="3.9" rx="1.95" fill="#FBBF24"/>
  <rect x="14.2" y="25.7" width="14.8" height="3.9" rx="1.95" fill="#ffffff"/>
</svg>
