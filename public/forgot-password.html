<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <title>Forgotten password · EduPay</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="auth-page" data-flow="forgot">
  <div class="space-backdrop" aria-hidden="true">
    <div class="space-layer space-layer-far"></div>
    <div class="space-layer space-layer-mid"></div>
    <div class="space-glow"></div>
  </div>

  <main class="auth-wrapper">
    <div class="auth-card">
      <header class="auth-logo">
        <h1>Edu<span>Pay</span></h1>
        <p>Reset your password</p>
      </header>

      <p id="flowError" class="auth-alert auth-alert-error" role="alert" hidden></p>
      <p id="flowNotice" class="auth-alert auth-alert-success" role="status" hidden></p>

      <form id="forgotForm" class="auth-form" novalidate>
        <p class="flow-greeting">Enter your username or the email address on your account and we will
          send you a link to choose a new password.</p>

        <div class="form-group">
          <label for="identifier">Username or email</label>
          <input type="text" id="identifier" name="identifier" autocomplete="username" autocapitalize="none"
            spellcheck="false" required placeholder="your.username">
        </div>

        <button type="submit" id="flowSubmit" class="btn btn-primary btn-block">Send reset link</button>
      </form>
    </div>

    <p class="auth-footnote"><a href="/">Back to sign in</a></p>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/password-flows.js"></script>
</body>

</html>
